name: Profile assets

# Regenerates the stats SVGs (assets/generated) and the contribution snake every day.
on:
  schedule:
    - cron: "17 0 * * *"   # 05:47 IST daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write   # commit the stats SVGs to main and the snake to the "output" branch

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats.py "${{ github.repository_owner }}"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#4F6BFF&color_dots=#161B33,#2B2F6B,#4B3FA8,#7C5CF6,#22D3EE
            dist/snake-light.svg?color_snake=#3B54E6&color_dots=#ECEEFF,#C7CCF5,#9A8CF0,#6D3FE0,#0891B2
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
